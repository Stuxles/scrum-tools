version: "3.9"

services:
  scrum-poker:
    build: .
    image: scrum-poker:latest
    container_name: scrum-poker
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # Set this to the LAN IP (or hostname) of your Unraid server
      # so that QR codes point to the correct address.
      - PUBLIC_URL=http://192.168.1.100:3000
      - PORT=3000
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
