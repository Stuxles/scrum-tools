version: "3.9"

services:
  scrum-poker:
    build: .
    image: scrum-poker-collab:latest
    container_name: scrum-poker
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # Stel dit in op het LAN-IP (of hostname) van je Unraid server
      # zodat QR-codes naar het juiste adres wijzen.
      - PUBLIC_URL=http://192.168.1.100:3000
      - PORT=3000
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
