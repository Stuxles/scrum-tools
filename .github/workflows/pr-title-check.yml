name: PR Title Check

# Enforces that PR titles follow Conventional Commits (feat:, fix:, ...).
# GitHub's default merge-commit body is the PR title, and
# .github/workflows/version-bump.yml scans commit messages for these same
# prefixes to decide the semver bump on merge - so a correctly formatted
# title is what keeps that automation meaningful, not just tidy history.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  title-check:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            chore
            docs
            test
            refactor
            style
            ci
            perf
            revert
          requireScope: false
