name: PR Title Check

# Enforces that PR titles follow Conventional Commits (feat:, fix:, ...).
# GitHub's default merge-commit body is the PR title, and
# the version-bump job in docker-build.yml scans commit messages for these same
# prefixes to decide the semver bump on merge - so a correctly formatted
# title is what keeps that automation meaningful, not just tidy history.

on:
  pull_request:
    # No `synchronize`: a code push cannot change the PR title. The reason to
    # keep it would be a required status check needing a result on the new
    # head SHA, and main has no required checks.
    types: [opened, edited, reopened]

permissions:
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  title-check:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            chore
            docs
            test
            refactor
            style
            ci
            perf
            revert
          requireScope: false
